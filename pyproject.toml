[project]
name = "htb-hosts"
version = "1.0.0"
description = "Sudo-free, cleanable /etc/hosts management for HTB"
license = "MIT"
requires-python = ">=3.11"
# The runtime is stdlib only, forever; uv.lock pins just the dev toolchain.
dependencies = []

[dependency-groups]
dev = [
    "black==26.10.1",
    "pylint==4.1.3",
    "zizmor==1.31.1",
]

[tool.uv]
package = false

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.main]
# The CLI entrypoint is named `htb-hosts` (no .py); lint it via a temp copy.
py-version = "3.11"

[tool.pylint."messages control"]
# Dispatcher-shaped functions legitimately have many branches/returns; those
# are suppressed inline at the call sites rather than globally.
disable = []
