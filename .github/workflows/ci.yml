name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only checks out and tests code; never let it write to the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # Actions pinned to commit SHAs (tags are movable) — same spirit as the
      # pinned linter versions below.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test (stdlib only, no deps)
        run: make test
      - name: Smoke
        run: make smoke

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      # Pinned so the 10.00/10 gate is reproducible and immune to linter drift.
      - name: Install linters
        run: pip install "black==26.5.1" "pylint==4.0.6"
      - name: Lint (black --check + pylint 10.00/10)
        run: make lint
      # The completion scripts need a shell, not Python, so they get their own
      # syntax gate; zsh is not on the runner by default.
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Lint the shell completions
        run: make lint-completions
