name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test (stdlib only, no deps)
        run: make test
      - name: Smoke
        run: make smoke

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Pinned so the 10.00/10 gate is reproducible and immune to linter drift.
      - name: Install linters
        run: pip install "black==26.5.1" "pylint==4.0.6"
      - name: Lint (black --check + pylint 10.00/10)
        run: make lint
